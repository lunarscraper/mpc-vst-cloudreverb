# Cloud Reverb MPC skin layout: the REVERB tab has the eight controls for playing at the
# positions of the Force's eight knobs (qlinks), grid and r=48 as in mpc-vst-rattler. Frame titles
# empty: the tab name is already in the tab bar. PRESET tab: TYPE (what CHARACTER does depends
# on it), PRE-DELAY, which a pad sound rarely needs, and ROOT and CHORD, which only the MODAL type
# uses; below them the knob only browses the 32 slots, LOAD and SAVE act.
# Palette: night-sky panel, cloud-white print, sky-blue accents.
style=td3
theme_bg=151a24
theme_panel=222a3a
theme_line=0d1018
theme_ink=eef2f8
theme_ink_dim=a9b4c6
theme_ink_faint=5a6578
theme_accent=6ec1ff
theme_accent_hi=a8dcff
theme_knob_face=0d1018
theme_knob_ring=000000
theme_bar=6ec1ff
theme_seg_active=6ec1ff
theme_seg_inactive=0d1018
theme_seg_active_tx=111111
theme_btn_text=111111
theme_well=0a0d14
theme_knob_off=4a5568
theme_tab_on=6ec1ff
theme_tab_on_tx=111111
theme_lcd=0a121c
theme_box=1a2030
theme_btn_bg=eef2f8
theme_chrome_ink=eef2f8
theme_go_on=6ec1ff
theme_go_off=a8dcff
theme_tabs=6ec1ff

[tab REVERB]
frame x=36 y=88 w=1207 h=624 title=""
knob cx=190 cy=250 r=48 label="MIX" key=mix
knob cx=490 cy=250 r=48 label="SIZE" key=size
knob cx=790 cy=250 r=48 label="DECAY" key=decay
knob cx=1090 cy=250 r=48 label="CHARACTER" key=character
knob cx=190 cy=530 r=48 label="DIFFUSION" key=diffusion
knob cx=490 cy=530 r=48 label="MODULATION" key=mod
knob cx=790 cy=530 r=48 label="TONE" key=tone
knob cx=1090 cy=530 r=48 label="LOW CUT" key=lowcut
qlinks "REVERB" = mix,size,decay,character,diffusion,mod,tone,lowcut

[tab PRESET]
frame x=36 y=88 w=1207 h=624 title=""
popup cx=190 cy=240 w=230 h=48 label="TYPE" key=type
knob cx=490 cy=250 r=48 label="PRE-DELAY" key=predelay
knob cx=790 cy=250 r=48 label="ROOT" key=root
popup cx=1090 cy=240 w=230 h=48 label="CHORD" key=chord
button cx=340 cy=540 label="LOAD" key=load
knob cx=640 cy=530 r=48 label="PRESET" key=slot
button cx=940 cy=540 label="SAVE" key=save
qlinks "PRESET" = type,predelay,root,chord,slot,load,save
