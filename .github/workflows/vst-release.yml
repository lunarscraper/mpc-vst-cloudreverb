name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 0.1.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  cloudreverb:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: cloudreverb-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: cloudreverb
      license: MIT
      about: Cloud Reverb (insert effect) - a light reverb for long, moving ambient tails; seven types (CLOUD with bloom, SWELL, SHIMMER, TIDE, DRONE, CHOIR, MODAL), nine controls and 32 preset slots with LOAD/SAVE.
      dry_run: ${{ inputs.dry_run }}
